<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f5960">
  <title>AK Branch Monitor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="AK Branch Monitor">
        <span class="brand-mark">AK</span>
        <span class="brand-copy"><b>Branch Monitor</b><small>Operations workspace</small></span>
      </a>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <span class="account">AS</span>
        <span><b id="signed-user">Branch administrator</b><small>66 registered branches</small></span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div><span class="eyebrow">Branch intelligence</span><h1 id="page-title">Overview</h1></div>
        <div class="top-actions">
          <span class="source-chip"><i></i><span id="source-label">Loading source…</span></span>
          <button id="language" class="button quiet" type="button">العربية</button>
          <button id="logout" class="button quiet" type="button">Sign out</button>
          <button id="refresh" class="button primary" type="button">Refresh data</button>
        </div>
      </header>
      <main id="main" tabindex="-1"><div id="page" class="page-loading">Loading branch data…</div></main>
      <footer><span>AK Branch Monitor</span><span id="freshness"></span></footer>
    </div>
  </div>
  <dialog id="detail" aria-labelledby="detail-title"><button class="dialog-close" type="button" aria-label="Close details">×</button><div id="detail-body"></div></dialog>
  <dialog id="user-dialog" aria-labelledby="user-dialog-title"><button class="dialog-close user-dialog-close" type="button" aria-label="Close user management">×</button><div id="user-dialog-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
